services:
  back:
    build:
      context: ../agentesia-back
    restart: unless-stopped
    env_file: ../agentesia-back/.env
    ports:
      - "3000:3000"

  front:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3000"
    depends_on:
      - back
